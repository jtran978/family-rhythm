name: Reminders

# Started at 2 minutes past every hour by Supabase's scheduler (pg_cron), see
# supabase/migrations/011_reliable_reminder_schedule.sql. GitHub's own schedule
# skipped too many hours to rely on. The script decides what to send based on New York time.
on:
  workflow_dispatch:
    inputs:
      force:
        description: 'Send a test now (weigh, chores or bills). Leave blank for a normal run.'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  remind:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: node scripts/send-reminders.mjs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
          REMINDER_FORCE: ${{ inputs.force }}
